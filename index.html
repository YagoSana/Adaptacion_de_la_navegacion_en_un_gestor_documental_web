<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Resultados PageRank</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Árbol colapsable */
        .tree ul {
            display: none;
            padding-left: 20px;
        }
        .tree ul.abierto {
            display: block;
        }
        .tree li {
            list-style: none;
            margin: 4px 0;
        }
        .toggle {
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 3px 6px;
            border-radius: 4px;
            transition: background 0.15s;
        }
        .toggle:hover {
            background: #f0f4ff;
        }
        .toggle .icono {
            font-size: 11px;
            color: #888;
            width: 12px;
            display: inline-block;
            transition: transform 0.2s;
        }
        .toggle.abierto .icono {
            transform: rotate(90deg);
        }
        .toggle .nombre {
            font-weight: 600;
            color: #2c3e50;
        }
        .toggle.hoja .nombre {
            font-weight: 400;
            color: #444;
            font-size: 0.9rem;
        }
        .val-tag {
            font-family: 'Consolas', monospace;
            font-size: 0.8rem;
            color: #3498db;
            background: #eaf4fd;
            padding: 1px 5px;
            border-radius: 3px;
        }
        /* Tabla paginada */
        .paginacion {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .paginacion button {
            padding: 4px 10px;
            font-size: 0.85rem;
            margin: 0;
        }
        .paginacion button.activa {
            background: #2980b9;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Resultados de PageRank</h1>
        <p>Ajustar parámetros del algoritmo:</p>

        <div class="controls">
            <div class="control-group">
                <label>Peso Libros (Hojas): <span id="val_libros">3</span></label>
                <input type="range" id="input_libros" min="1" max="5" step="0.5" value="3"
                    oninput="val_libros.innerText=this.value">
            </div>
            <div class="control-group">
                <label>Peso Referencias: <span id="val_refs">3</span></label>
                <input type="range" id="input_refs" min="1" max="5" step="0.5" value="3"
                    oninput="val_refs.innerText=this.value">
            </div>
        </div>

        <div class="buttons">
            <button id="btn-main" onclick="cargarResultados()">Calcular Datos</button>
        </div>

        <hr>

        <div class="resultados-grid">

            <div class="panel">
                <h2>Ranking Global</h2>
                <table id="tabla-resultados">
                    <thead>
                        <tr>
                            <th>Nodo (Categoría/Libro)</th>
                            <th>Valor PageRank</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo-tabla"></tbody>
                </table>
                <div class="paginacion" id="paginacion"></div>
            </div>

            <div class="panel">
                <h2>Estructura del Grafo</h2>
                <div class="tree-wrapper">
                    <ul id="arbol-raiz" class="tree"></ul>
                </div>
            </div>

        </div>
    </div>

    <script>
        // ── Estado global ──────────────────────────────────────────
        let tablaCompleta = [];
        let paginaActual = 0;
        const POR_PAGINA = 50;

        // ── Carga principal ────────────────────────────────────────
        async function cargarResultados() {
            const btn = document.getElementById('btn-main');
            const pesoLibro = document.getElementById('input_libros').value;
            const pesoRef   = document.getElementById('input_refs').value;

            btn.disabled = true;
            btn.innerText = "Calculando...";

            try {
                const res = await fetch('http://localhost:8080', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        peso_libro: parseFloat(pesoLibro),
                        peso_referencia: parseFloat(pesoRef)
                    })
                });

                const datos = await res.json();

                // Tabla paginada
                tablaCompleta = datos.tabla.sort((a, b) => b.valor - a.valor);
                paginaActual = 0;
                renderizarPagina(0);

                // Árbol lazy
                const raiz = document.getElementById('arbol-raiz');
                raiz.innerHTML = "";
                construirNodo(datos.arbol, raiz, true);

                btn.innerText = "Actualizar Datos";
            } catch (err) {
                console.error(err);
                alert("Error de conexión. ¿Está server.py encendido?");
                btn.innerText = "Reintentar";
            } finally {
                btn.disabled = false;
            }
        }

        // ── Tabla paginada ─────────────────────────────────────────
        function renderizarPagina(pagina) {
            paginaActual = pagina;
            const tbody = document.getElementById('cuerpo-tabla');
            tbody.innerHTML = "";

            const inicio = pagina * POR_PAGINA;
            const slice  = tablaCompleta.slice(inicio, inicio + POR_PAGINA);

            slice.forEach((item, i) => {
                const fila = document.createElement('tr');
                fila.innerHTML = `
                    <td>#${inicio + i + 1} ${item.nombre}</td>
                    <td class="num">${item.valor.toFixed(6)}</td>`;
                tbody.appendChild(fila);
            });

            // Botones de paginación
            const totalPaginas = Math.ceil(tablaCompleta.length / POR_PAGINA);
            const div = document.getElementById('paginacion');
            div.innerHTML = "";

            // Mostrar máx 7 botones alrededor de la página actual
            let inicio_p = Math.max(0, pagina - 3);
            let fin_p    = Math.min(totalPaginas - 1, pagina + 3);

            if (inicio_p > 0) {
                agregarBotonPag(div, 0, pagina);
                if (inicio_p > 1) div.innerHTML += '<span>…</span>';
            }
            for (let p = inicio_p; p <= fin_p; p++) agregarBotonPag(div, p, pagina);
            if (fin_p < totalPaginas - 1) {
                if (fin_p < totalPaginas - 2) div.innerHTML += '<span>…</span>';
                agregarBotonPag(div, totalPaginas - 1, pagina);
            }
        }

        function agregarBotonPag(contenedor, p, actual) {
            const btn = document.createElement('button');
            btn.innerText = p + 1;
            if (p === actual) btn.classList.add('activa');
            btn.onclick = () => renderizarPagina(p);
            contenedor.appendChild(btn);
        }

        // ── Árbol lazy colapsable ──────────────────────────────────
        function construirNodo(nodo, padre, abierto = false) {
            const tieneHijos = nodo.hijos && nodo.hijos.length > 0;
            const li = document.createElement('li');

            const toggle = document.createElement('div');
            toggle.className = 'toggle' + (tieneHijos ? '' : ' hoja');

            const icono = document.createElement('span');
            icono.className = 'icono';
            icono.textContent = tieneHijos ? '▶' : '•';

            const nombre = document.createElement('span');
            nombre.className = 'nombre';
            nombre.textContent = nodo.nombre;

            const val = document.createElement('span');
            val.className = 'val-tag';
            val.textContent = nodo.valor.toFixed(6);

            toggle.appendChild(icono);
            toggle.appendChild(nombre);
            toggle.appendChild(val);
            li.appendChild(toggle);

            if (tieneHijos) {
                // Ordenar hijos por valor descendente
                const hijosOrdenados = [...nodo.hijos].sort((a, b) => b.valor - a.valor);

                const ul = document.createElement('ul');
                if (abierto) ul.classList.add('abierto');

                let hijosGenerados = false;

                toggle.addEventListener('click', () => {
                    const estaAbierto = ul.classList.toggle('abierto');
                    toggle.classList.toggle('abierto', estaAbierto);

                    // Lazy: solo generamos los hijos la primera vez que se abre
                    if (estaAbierto && !hijosGenerados) {
                        hijosGenerados = true;
                        hijosOrdenados.forEach(hijo => construirNodo(hijo, ul, false));
                    }
                });

                // Si viene abierto por defecto (raíz), generar hijos ya
                if (abierto) {
                    hijosGenerados = true;
                    hijosOrdenados.forEach(hijo => construirNodo(hijo, ul, false));
                    toggle.classList.add('abierto');
                }

                li.appendChild(ul);
            }

            padre.appendChild(li);
        }
    </script>
</body>

</html>
