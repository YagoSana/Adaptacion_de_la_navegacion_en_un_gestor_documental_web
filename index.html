<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Análisis de Grafos - PageRank</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Muestra de valores de pagerank</h1>
        <p>Ajustar valores:</p>

        <!-- Insertar botones para modificar referencias y likes -->
        <div class="controls">
            <div class="control-group">
                <label>Peso Valoraciones: <span id="val_libros">3</span></label>
                <input type="range" id="input_libros" min="1" max="5" step="0.5" value="3" oninput="val_libros.innerText=this.value">
            </div>
            
            <div class="control-group">
                <label>Peso Referencias: <span id="val_refs">3</span></label>
                <input type="range" id="input_refs" min="1" max="5" step="0.5" value="3" oninput="val_refs.innerText=this.value">
            </div>
        </div>

        <button onclick="cargarResultados()">Calcular / Actualizar Datos</button>

        <table id="tabla-resultados">
            <thead>
                <tr>
                    <th>Nodo (Categoría/Libro)</th>
                    <th>Valores</th>
                </tr>
            </thead>
            <tbody id="cuerpo-tabla">
                </tbody>
        </table>
    </div>

    <script>
        async function cargarResultados() {
            const btn = document.querySelector('button');
            const tbody = document.getElementById('cuerpo-tabla');
            
            // Capturar los valores de los sliders
            const pesoLibro = document.getElementById('input_libros').value;
            const pesoRef = document.getElementById('input_refs').value;
            
            btn.innerText = "Calculando...";
            btn.disabled = true;
            tbody.innerHTML = "";

            try {
                const res = await fetch('http://localhost:8080', { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        peso_libro: parseFloat(pesoLibro),
                        peso_referencia: parseFloat(pesoRef)
                    })
                });
                const datos = await res.json();

                datos.forEach(item => {
                    const row = `<tr>
                        <td>${item.nombre}</td>
                        <td class="num">${item.valor}</td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
                btn.innerText = "Actualizar Datos";
            } catch (err) {
                alert("Error: ¿Está el servidor encendido?");
                btn.innerText = "Reintentar";
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
